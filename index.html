<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מדמה סוויטש L2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f5f0e8;
    --surface:   #fdfaf4;
    --panel:     #eee8d8;
    --border:    #d6cebc;
    --border2:   #c8bfa8;
    --accent:    #1a6fbf;
    --accent2:   #1557a0;
    --green:     #1a7a3c;
    --green-bg:  #e6f4ec;
    --yellow:    #8a6000;
    --yellow-bg: #fdf4dc;
    --red:       #c0392b;
    --purple:    #6b3fa0;
    --purple-bg: #f0eaf8;
    --text:      #1c1c1c;
    --muted:     #6b6358;
    --muted2:    #9a9080;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'Heebo', sans-serif;
    --shadow:    0 2px 8px rgba(0,0,0,.08);
    --shadow-lg: 0 4px 20px rgba(0,0,0,.12);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 1.5rem;
    direction: rtl;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  /* ── Crazy Avatar Logo (ללא עיגול מסגרת מיותר) ── */
  .logo {
    width: 52px; 
    height: 52px;
    flex-shrink: 0;
    perspective: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .crazy-avatar {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(107, 63, 160, 0.4);
    animation: crazySpin 6s linear infinite;
  }

  /* 🎯 אנימציה מטורללת: סיבוב תלת-ממדי חלק ונקי */
  @keyframes crazySpin {
    0% {
      transform: rotateY(0deg) scale(1);
      filter: drop-shadow(0 0 2px var(--accent));
    }
    50% {
      transform: rotateY(180deg) scale(1.08);
      filter: drop-shadow(0 0 8px var(--purple));
    }
    100% {
      transform: rotateY(360deg) scale(1);
      filter: drop-shadow(0 0 2px var(--accent));
    }
  }

  h1 { font-size: 1.5rem; font-weight: 900; color: var(--text); letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: .78rem; color: var(--muted); margin-top: 2px; }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 1rem;
  }
  
  .left-col {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  
  .tables-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .card-hdr {
    display: flex; align-items: center; gap: .5rem;
    padding: .6rem 1rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: .8rem; font-weight: 700;
    color: var(--text);
    letter-spacing: .02em;
  }
  .card-hdr .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .card-body { padding: 1rem; }

  /* ── Inputs ── */
  label { font-size: .72rem; color: var(--muted); display: block; margin-bottom: .25rem; font-weight: 500; }
  input, select {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--mono);
    font-size: .78rem;
    padding: .4rem .65rem;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
    direction: ltr;
  }
  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(26,111,191,.12);
  }
  input::placeholder { color: var(--muted2); }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: flex-end; }

  .btn {
    padding: .42rem 1rem;
    border-radius: 7px;
    border: none;
    font-family: var(--sans);
    font-size: .78rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }
  .btn:hover { opacity: .88; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: var(--green); color: #fff; }
  .btn-neutral { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .btn-play    { background: var(--purple); color: #fff; }
  .btn-sm { padding: .32rem .75rem; font-size: .72rem; }

  /* ── Host chips ── */
  .host-chip {
    display: inline-flex; align-items: center; gap: .35rem;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 7px;
    padding: .28rem .6rem;
    font-size: .7rem;
    font-family: var(--mono);
    margin: .2rem;
    cursor: pointer;
    transition: border-color .18s;
  }
  .host-chip:hover { border-color: var(--red); }
  .host-chip .hname { color: var(--accent); font-weight: 700; }
  .host-chip .hip   { color: var(--muted); }
  .host-chip .hmac  { color: var(--purple); }
  .host-chip .del   { color: var(--red); opacity: .5; margin-right: 2px; }
  .host-chip:hover .del { opacity: 1; }

  /* ── Network SVG ── */
  #net-wrap {
    background: var(--panel);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  #net-svg { display: block; width: 100%; }

  /* ── Code viewer (חלונית קטנה) ── */
  #code-wrap {
    height: 200px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: .7rem;
    line-height: 1.5;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    background: #fdfaf4;
  }
  .code-section { border-bottom: 1px solid var(--border); }
  .sec-hdr {
    padding: .25rem .75rem;
    font-size: .65rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .sec-hdr.active { color: var(--accent2); background: #deeaf8; }
  .code-line {
    display: flex;
    border-left: 3px solid transparent;
    transition: background .18s;
    direction: ltr;
  }
  .code-line.hl {
    background: #deeaf8;
    border-left-color: var(--accent);
  }
  .ln {
    min-width: 24px;
    padding: 1px 4px;
    color: var(--muted2);
    text-align: right;
    user-select: none;
    flex-shrink: 0;
    font-size: .65rem;
  }
  .lc { padding: 1px 6px; color: var(--muted); white-space: pre; }
  .code-line.hl .lc { color: var(--text); font-weight: 600; }

  /* ── Step bar ── */
  #step-bar {
    display: flex; align-items: center; gap: .4rem;
    padding: .5rem .75rem;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .step-counter {
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--muted);
    min-width: 72px;
  }
  #step-desc {
    font-size: .75rem;
    color: var(--accent2);
    font-weight: 600;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Tables (מוגדלות ובולטות) ── */
  .large-table-container {
    min-height: 180px;
  }
  table.tbl {
    width: 100%; border-collapse: collapse;
    font-family: var(--mono); font-size: .85rem;
  }
  .tbl th {
    color: var(--accent2); font-weight: 700;
    text-align: right; padding: .5rem .6rem;
    border-bottom: 2px solid var(--border);
    font-size: .75rem; text-transform: uppercase;
    background: var(--panel);
  }
  .tbl td {
    padding: .5rem .6rem;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  
  /* ── ARP ── */
  .arp-host { 
    margin-bottom: .8rem; 
    background: var(--bg);
    padding: .5rem .75rem;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .arp-name { font-size: .78rem; font-weight: 700; color: var(--accent); font-family: var(--mono); margin-bottom: .3rem; }
  .arp-empty { color: var(--muted2); font-family: var(--mono); font-size: .75rem; }
  .arp-entry { font-family: var(--mono); font-size: .8rem; color: var(--text); font-weight: 600; }
  .arp-entry .arrow { color: var(--muted2); margin: 0 .3rem; }

  /* ── Log ── */
  #log {
    height: 120px; overflow-y: auto;
    font-family: var(--mono); font-size: .75rem; line-height: 1.75;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .log-entry { color: var(--muted); }
  .log-entry.latest { color: var(--text); font-weight: 700; }
  .log-entry.arp   { color: var(--yellow); }
  .log-entry.arpr  { color: var(--green);  }
  .log-entry.data  { color: var(--accent); }
  .log-entry.flood { color: var(--purple); }

  .empty { color: var(--muted2); font-size: .8rem; font-family: var(--mono); text-align: center; padding: 1.5rem; }

  /* ── Speed ── */
  #speed-wrap { display: flex; align-items: center; gap: .5rem; font-size: .72rem; color: var(--muted); }
  #speed { width: 80px; accent-color: var(--accent); cursor: pointer; }

  /* ── Packet pulse ── */
  @keyframes pkpulse {
    0%,100% { opacity: 1; r: 13; }
    50%      { opacity: .6; r: 16; }
  }
  .pkt-circle { animation: pkpulse .65s ease-in-out infinite; }

  .span2 { grid-column: 1 / -1; }

  /* ── Floating Bot Widget ── */
  .bot-widget {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 2px solid var(--accent);
    padding: 8px 14px 8px 8px;
    border-radius: 50px;
    box-shadow: var(--shadow-lg);
    cursor: pointer;
    text-decoration: none;
    color: var(--text);
    z-index: 1000;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .bot-widget:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
  }
  .bot-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
  }
  .bot-text {
    display: flex;
    flex-direction: column;
  }
  .bot-title {
    font-size: .82rem;
    font-weight: 700;
    color: var(--accent2);
  }
  .bot-sub {
    font-size: .68rem;
    color: var(--muted);
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .span2 { grid-column: 1; }
    .tables-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <!-- הלוגו מעודכן עם האוואטר המסתובב ללא רקע מיותר -->
  <div class="logo">
    <img src="https://lh3.googleusercontent.com/d/1t9QaPCKLvtAhWncetA83ALY8EIvpnFte" alt="Crazy Avatar" class="crazy-avatar">
  </div>
  <div>
    <h1>L2 Switch <span>Simulator</span></h1>
    <div class="subtitle">מדמה שלב-אחרי-שלב — ARP, MAC Learning & Forwarding</div>
  </div>
</header>

<div class="grid">

  <!-- עמודה ימנית: בקרות + טופולוגיה + קוד -->
  <div class="left-col">

    <!-- Add host & Send frame -->
    <div class="card">
      <div class="card-hdr"><span class="dot" style="background:var(--green)"></span>הגדרות ופעולות</div>
      <div class="card-body">
        <div class="row" style="margin-bottom:.8rem">
          <div><label>שם</label><input id="in-name" placeholder="PC1" style="width:60px"></div>
          <div><label>כתובת IP</label><input id="in-ip" placeholder="192.168.1.1" style="width:110px"></div>
          <div><label>MAC</label><input id="in-mac" placeholder="AA:01" style="width:70px"></div>
          <div><button class="btn btn-success" onclick="addHost()">+ הוסף</button></div>
        </div>
        <div id="host-list" style="margin-bottom: 1rem;"></div>
        <hr style="border:0; border-top: 1px solid var(--border); margin: .8rem 0;">
        <div class="row">
          <div><label>שולח</label><select id="sel-src" style="width:110px"></select></div>
          <div><label>IP יעד</label><input id="in-dst" placeholder="192.168.1.2" style="width:110px"></div>
          <div><label>הודעה</label><input id="in-msg" placeholder="שלום!" style="width:80px"></div>
          <div><button class="btn btn-primary" onclick="runSim()">▶ הרץ</button></div>
          <div id="speed-wrap" style="margin-right:auto;">
            <span>מהירות:</span>
            <input type="range" id="speed" min="300" max="2500" value="1200" step="100">
            <span id="speed-label">1.2s</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Topology -->
    <div class="card">
      <div class="card-hdr"><span class="dot" style="background:var(--purple)"></span>טופולוגיית רשת</div>
      <div class="card-body" style="padding:.75rem">
        <div id="net-wrap"><svg id="net-svg" viewBox="0 0 320 210" style="display:block;width:100%"></svg></div>
      </div>
    </div>

    <!-- Code viewer (חלונית קטנה) -->
    <div class="card" style="display:flex;flex-direction:column">
      <div class="card-hdr" style="justify-content:space-between">
        <span style="display:flex;align-items:center;gap:.5rem">
          <span class="dot" style="background:var(--yellow)"></span>קוד פייתון מדמה (Python)
        </span>
        <span id="active-fn" style="color:var(--accent2);font-size:.72rem;font-family:var(--mono);font-weight:700"></span>
      </div>
      <div id="code-wrap"></div>
      <div id="step-bar">
        <button class="btn btn-sm btn-neutral" onclick="resetSim()">↺ איפוס</button>
        <button class="btn btn-sm btn-neutral" onclick="prevStep()">◀ אחורה</button>
        <button class="btn btn-sm btn-primary" onclick="nextStep()">▶ קדימה</button>
        <button class="btn btn-sm btn-play" id="play-btn" onclick="togglePlay()">▶▶ אוטו</button>
        <span class="step-counter" id="step-counter">לחץ הרץ</span>
        <span id="step-desc"></span>
      </div>
    </div>

  </div>

  <!-- עמודה שמאלית: טבלאות מוגדלות + לוג -->
  <div class="left-col">

    <div class="tables-row">
      <!-- MAC Table -->
      <div class="card">
        <div class="card-hdr"><span class="dot" style="background:var(--accent)"></span>טבלת מתג MAC Table</div>
        <div class="card-body large-table-container" style="padding:.75rem">
          <div id="mac-table-wrap"><div class="empty">ריקה</div></div>
        </div>
      </div>

      <!-- ARP Tables -->
      <div class="card">
        <div class="card-hdr"><span class="dot" style="background:var(--green)"></span>טבלאות ARP ברשת</div>
        <div class="card-body large-table-container" style="padding:.75rem">
          <div id="arp-tables-wrap"><div class="empty">ריקות</div></div>
        </div>
      </div>
    </div>

    <!-- לוג activity -->
    <div class="card" style="flex:1;">
      <div class="card-hdr"><span class="dot" style="background:var(--yellow)"></span>לוג פעילות רשת</div>
      <div class="card-body" style="padding:.75rem">
        <div id="log"><div class="empty">הרץ סימולציה לצפייה ביומן הפעילות...</div></div>
      </div>
    </div>

  </div>

</div>

<!-- חלונית צפה לבוט -->
<a href="https://gemini.google.com/gem/13FFjtbW5S3yg0EE1qBEQiP8GEMwoepKu?usp=sharing" target="_blank" class="bot-widget">
  <img src="https://lh3.googleusercontent.com/d/1fzqv93VKIW_VT8-e1HdJxBmbU2sFnwlb" alt="Bot Avatar" class="bot-avatar" onerror="this.src='https://via.placeholder.com/42?text=🤖'">
  <div class="bot-text">
    <span class="bot-title">שאל את הבוט</span>
    <span class="bot-sub">עוזר למידה אישי</span>
  </div>
</a>

<script>
// ──────────────────────────────────────────────
//  STATE
// ──────────────────────────────────────────────
let hosts = [
  { name:"PC1", ip:"192.168.1.1", mac:"AA:01" },
  { name:"PC2", ip:"192.168.1.2", mac:"AA:02" },
  { name:"PC3", ip:"192.168.1.3", mac:"AA:03" },
];
let steps = [], cur = -1, playTimer = null, isPlaying = false;

// ──────────────────────────────────────────────
//  CODE DEFINITIONS
// ──────────────────────────────────────────────
const CODE = {
  sendPacket: {
    label: "Host.send_packet()",
    lines: [
      "def send_packet(self, target_ip, msg, switch):",
      "    if target_ip in self.arp_table:",
      "        dst_mac = self.arp_table[target_ip]",
      "        frame = Frame(self.mac, dst_mac, self.ip, target_ip, msg, type='DATA')",
      "    else:",
      "        frame = Frame(self.mac, 'FF:FF:FF:FF:FF:FF', self.ip, target_ip, 'ARP_REQ', type='ARP_REQ')",
      "    switch.receive_frame(frame, self)",
    ],
  },
  switchReceive: {
    label: "Switch.receive_frame()",
    lines: [
      "def receive_frame(self, frame, incoming_host):",
      "    self.mac_table[frame.src_mac] = incoming_host # Learning",
      "    if frame.dst_mac == 'FF:FF:FF:FF:FF:FF':",
      "        for host in self.ports:",
      "            if host != incoming_host: host.receive_frame(frame)",
      "    elif frame.dst_mac in self.mac_table:",
      "        target = self.mac_table[frame.dst_mac]",
      "        target.receive_frame(frame)",
      "    else:",
      "        # Flooding",
      "        for host in self.ports:",
      "            if host != incoming_host: host.receive_frame(frame)",
    ],
  },
  hostReceive: {
    label: "Host.receive_frame()",
    lines: [
      "def receive_frame(self, frame):",
      "    if frame.dst_mac in [self.mac, 'FF:FF:FF:FF:FF:FF']:",
      "        if frame.type == 'ARP_REQ' and frame.dst_ip == self.ip:",
      "            self.arp_table[frame.src_ip] = frame.src_mac",
      "            return Frame(self.mac, frame.src_mac, self.ip, frame.src_ip, 'ARP_REPLY', type='ARP_REPLY')",
      "        elif frame.type == 'ARP_REPLY' and frame.dst_ip == self.ip:",
      "            self.arp_table[frame.src_ip] = frame.src_mac",
      "        elif frame.type == 'DATA' and frame.dst_mac == self.mac:",
      "            print(f'Received: {frame.payload}')",
    ],
  },
};

// ──────────────────────────────────────────────
//  BUILD STEPS
// ──────────────────────────────────────────────
function buildSim(srcIdx, dstIp, msg) {
  const dstIdx = hosts.findIndex(h => h.ip === dstIp);
  if (dstIdx < 0 || dstIdx === srcIdx) return [];
  const src = hosts[srcIdx], dst = hosts[dstIdx];
  let macSnap = {}, arpSnap = hosts.map(() => ({}));
  const result = [];

  const add = (section, lines, desc, logEntry, logType, pkt, mutateFn) => {
    if (mutateFn) mutateFn(macSnap, arpSnap);
    result.push({
      section, lines: new Set(lines), desc, logEntry, logType, pkt,
      mac: {...macSnap}, arp: arpSnap.map(t => ({...t}))
    });
  };

  const others = hosts.filter((_, i) => i !== srcIdx && i !== dstIdx);

  add("sendPacket",[0,4,5,6],
    `${src.name}.send_packet("${dstIp}") — MAC לא ידוע, בונה ARP_REQUEST Broadcast`,
    `📤 ${src.name} רוצה לשלוח ל-${dstIp} — MAC לא ידוע! בונה Broadcast`,
    "arp", null, null);

  add("sendPacket",[6],
    `קורא ל-switch.receive_frame(ARP_REQ, dst_mac=FF:FF:FF:FF:FF:FF)`,
    `→ switch.receive_frame() נקרא עם ARP_REQ`,
    "arp", { from: srcIdx, to:"sw", kind:"ARP" }, null);

  add("switchReceive",[0,1],
    `הסוויטש לומד: ${src.mac} → Port ${srcIdx+1} (MAC Learning)`,
    `🔍 Switch למד: ${src.mac} ← Port ${srcIdx+1}`,
    "flood", null, m => { m[src.mac] = srcIdx; });

  add("switchReceive",[2,3,4],
    `dst_mac == FF:FF:FF:FF:FF:FF → FLOOD לכל ${hosts.length-1} הפורטים!`,
    `📢 BROADCAST FLOOD! ARP_REQ נשלח לכל הפורטים`,
    "flood", { from:"sw", to:"broadcast", kind:"ARP", exclude: srcIdx }, null);

  if (others.length > 0) {
    add("hostReceive",[0,1],
      `${others.map(h=>h.name).join(", ")}: dst_ip ≠ self.ip → return None (מושלך)`,
      `🚫 ${others.map(h=>h.name).join(", ")}: לא בשבילי — מסגרת מושלכת`,
      "flood", null, null);
  }

  add("hostReceive",[0,1,2,3,4],
    `${dst.name}: זה בשבילי! dst_ip == ${dst.ip} → מעדכן ARP ושולח Reply`,
    `📬 ${dst.name}: ARP_REQ עבורי! ${src.ip}→${src.mac} נשמר, שולח ARP_REPLY`,
    "arpr", { from: dstIdx, to:"sw", kind:"ARP_REPLY" },
    (m,a) => { a[dstIdx][src.ip] = src.mac; });

  add("switchReceive",[0,1],
    `הסוויטש לומד: ${dst.mac} → Port ${dstIdx+1}`,
    `🔍 Switch למד: ${dst.mac} ← Port ${dstIdx+1}`,
    "arpr", null, m => { m[dst.mac] = dstIdx; });

  add("switchReceive",[5,6,7],
    `${dst.mac} נמצא בטבלה → Unicast ל-Port ${srcIdx+1} בלבד`,
    `🎯 ARP_REPLY → Unicast ישיר ל-Port ${srcIdx+1} (${src.name})`,
    "arpr", { from:"sw", to: srcIdx, kind:"ARP_REPLY" }, null);

  add("hostReceive",[0,5,6],
    `${src.name}: ARP_REPLY התקבל! ${dst.ip} = ${dst.mac} → עדכון טבלת ARP`,
    `✅ ${src.name}: ARP_REPLY! ${dst.ip}→${dst.mac} נשמר בטבלה`,
    "arpr", null, (m,a) => { a[srcIdx][dst.ip] = dst.mac; });

  add("sendPacket",[0,1,2,3],
    `${src.name} מנסה שוב — ${dst.ip} ידוע עכשיו! בונה DATA Unicast`,
    `🔄 send_packet() שוב: MAC ידוע! בונה מסגרת DATA`,
    "data", null, null);

  add("sendPacket",[6],
    `קורא ל-switch.receive_frame(DATA, dst_mac=${dst.mac})`,
    `→ switch.receive_frame() עם DATA frame`,
    "data", { from: srcIdx, to:"sw", kind:"DATA" }, null);

  add("switchReceive",[0,5,6,7],
    `הסוויטש: ${dst.mac} בטבלה → מעביר ל-Port ${dstIdx+1}, ללא Flooding`,
    `🎯 DATA → Unicast ישיר ל-Port ${dstIdx+1} (${dst.name})`,
    "data", { from:"sw", to: dstIdx, kind:"DATA" }, null);

  add("hostReceive",[0,7,8],
    `${dst.name}: DATA עבורי (dst_mac == self.mac) → הודעה התקבלה!`,
    `✉️  ${dst.name} קיבל: "${msg}"`,
    "data", null, null);

  return result;
}

// ──────────────────────────────────────────────
//  RENDER CODE
// ──────────────────────────────────────────────
function renderCode() {
  const wrap = document.getElementById("code-wrap");
  wrap.innerHTML = "";
  for (const [sec, def] of Object.entries(CODE)) {
    const div = document.createElement("div");
    div.className = "code-section";
    div.dataset.sec = sec;
    const hdr = document.createElement("div");
    hdr.className = "sec-hdr"; hdr.textContent = def.label;
    div.appendChild(hdr);
    def.lines.forEach((line, idx) => {
      const row = document.createElement("div");
      row.className = "code-line";
      row.dataset.sec = sec; row.dataset.ln = idx;
      row.innerHTML = `<span class="ln">${idx+1}</span><span class="lc">${esc(line)}</span>`;
      div.appendChild(row);
    });
    wrap.appendChild(div);
  }
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function applyHighlight(step) {
  document.querySelectorAll(".code-line").forEach(el => el.classList.remove("hl"));
  document.querySelectorAll(".sec-hdr").forEach(el => el.classList.remove("active"));
  document.getElementById("active-fn").textContent = "";
  if (!step) return;
  const { section, lines } = step;
  document.getElementById("active-fn").textContent = `▶ ${CODE[section].label}`;
  const secHdr = document.querySelector(`[data-sec="${section}"] .sec-hdr`);
  if (secHdr) { secHdr.classList.add("active"); secHdr.scrollIntoView({ block:"nearest", behavior:"smooth" }); }
  lines.forEach(ln => {
    const el = document.querySelector(`.code-line[data-sec="${section}"][data-ln="${ln}"]`);
    if (el) el.classList.add("hl");
  });
}

// ──────────────────────────────────────────────
//  NETWORK SVG (עם אייקונים של מחשבים)
// ──────────────────────────────────────────────
function renderNetwork(step) {
  const svg = document.getElementById("net-svg");
  const W = 320, H = 210;
  const SW = { x: W/2, y: H/2 };
  const n = hosts.length;
  const pts = hosts.map((_, i) => {
    const a = (i / n) * 2 * Math.PI - Math.PI/2;
    return { x: SW.x + 105*Math.cos(a), y: SW.y + 75*Math.sin(a) };
  });

  const pkt = step?.pkt;
  let html = "";

  // Lines
  hosts.forEach((_, i) => {
    const p = pts[i];
    const active = pkt && (
      pkt.from === i || pkt.to === i ||
      (pkt.to === "broadcast" && i !== pkt.exclude)
    );
    html += `<line x1="${SW.x}" y1="${SW.y}" x2="${p.x}" y2="${p.y}"
      stroke="${active ? '#1a6fbf' : '#c8bfa8'}"
      stroke-width="${active ? 2.5 : 1.5}"
      ${active ? 'stroke-dasharray="4 3"' : ''}/>`;
  });

  // Switch
  html += `
    <rect x="${SW.x-34}" y="${SW.y-20}" width="68" height="40" rx="8"
      fill="#deeaf8" stroke="#1a6fbf" stroke-width="2"/>
    <text x="${SW.x}" y="${SW.y-3}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="11" font-weight="700" fill="#1557a0">Switch</text>
    <text x="${SW.x}" y="${SW.y+12}" text-anchor="middle"
      font-family="IBM Plex Mono" font-size="8" fill="#1a6fbf">L2</text>
  `;

  // Hosts with Computer Icons 🖥️
  hosts.forEach((h, i) => {
    const p = pts[i];
    const isSrc = pkt?.from === i;
    const isDst = pkt?.to === i || (pkt?.to === "broadcast" && i !== pkt?.exclude);
    const fill   = isSrc ? "#fdf4dc" : isDst ? "#e6f4ec" : "#fdfaf4";
    const stroke = isSrc ? "#8a6000" : isDst ? "#1a7a3c" : "#c8bfa8";
    const sw     = isSrc || isDst ? 2 : 1;
    html += `
      <rect x="${p.x-36}" y="${p.y-25}" width="72" height="52" rx="8"
        fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
      <text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="14">🖥️</text>
      <text x="${p.x}" y="${p.y+7}" text-anchor="middle"
        font-family="IBM Plex Mono" font-size="9" font-weight="700" fill="#1c1c1c">${esc(h.name)}</text>
      <text x="${p.x}" y="${p.y+18}" text-anchor="middle"
        font-family="IBM Plex Mono" font-size="7.5" fill="#6b6358">${esc(h.ip)}</text>
    `;
  });

  // Packets
  if (pkt) {
    const clrs  = { ARP:"#8a6000", ARP_REPLY:"#1a7a3c", DATA:"#1a6fbf" };
    const bgclr = { ARP:"#fdf4dc", ARP_REPLY:"#e6f4ec", DATA:"#deeaf8" };
    const lbls  = { ARP:"ARP?", ARP_REPLY:"ARP!", DATA:"DATA" };
    const c  = clrs[pkt.kind]  || "#555";
    const bg = bgclr[pkt.kind] || "#eee";
    const lb = lbls[pkt.kind]  || "?";

    if (pkt.to === "broadcast") {
      hosts.forEach((_, i) => {
        if (i === pkt.exclude) return;
        const f = SW, t = pts[i];
        const mx = f.x + (t.x-f.x)*.62, my = f.y + (t.y-f.y)*.62;
        html += `
          <circle cx="${mx}" cy="${my}" r="12" fill="${bg}" stroke="${c}" stroke-width="1.5" class="pkt-circle"/>
          <text x="${mx}" y="${my+3}" text-anchor="middle"
            font-family="IBM Plex Mono" font-size="7" font-weight="700" fill="${c}">${lb}</text>
        `;
      });
    } else {
      const f = pkt.from === "sw" ? SW : pts[pkt.from];
      const t = pkt.to   === "sw" ? SW : pts[pkt.to];
      const mx = f.x + (t.x-f.x)*.5, my = f.y + (t.y-f.y)*.5;
      html += `
        <circle cx="${mx}" cy="${my}" r="13" fill="${bg}" stroke="${c}" stroke-width="1.5" class="pkt-circle"/>
        <text x="${mx}" y="${my+3}" text-anchor="middle"
          font-family="IBM Plex Mono" font-size="7.5" font-weight="700" fill="${c}">${lb}</text>
      `;
    }
  }

  svg.innerHTML = html;
}

// ──────────────────────────────────────────────
//  TABLES
// ──────────────────────────────────────────────
function renderMacTable(snap) {
  const wrap = document.getElementById("mac-table-wrap");
  if (!snap || !Object.keys(snap).length) { wrap.innerHTML='<div class="empty">טבלה ריקה</div>'; return; }
  wrap.innerHTML = `<table class="tbl"><thead><tr>
    <th>כתובת MAC</th><th>פורט (Port)</th></tr></thead><tbody>` +
    Object.entries(snap).map(([mac,idx])=>
      `<tr><td style="font-weight:600; color:var(--purple);">${mac}</td><td style="color:var(--accent);font-weight:700">Port ${idx+1}</td></tr>`
    ).join("") + `</tbody></table>`;
}

function renderArpTables(snap) {
  const wrap = document.getElementById("arp-tables-wrap");
  if (!snap) { wrap.innerHTML='<div class="empty">טבלאות ריקות</div>'; return; }
  wrap.innerHTML = hosts.map((h,i) => {
    const entries = Object.entries(snap[i]||{});
    return `<div class="arp-host">
      <div class="arp-name">🖥️ ${h.name} (${h.ip})</div>
      ${entries.length===0
        ? '<div class="arp-empty">אין רשומות</div>'
        : entries.map(([ip,mac])=>`<div class="arp-entry">${ip}<span class="arrow">➔</span><span style="color:var(--purple);">${mac}</span></div>`).join("")
      }
    </div>`;
  }).join("");
}

// ──────────────────────────────────────────────
//  LOG
// ──────────────────────────────────────────────
function renderLog() {
  const el = document.getElementById("log");
  if (cur < 0 || !steps.length) { el.innerHTML='<div class="empty">הרץ סימולציה לצפייה ביומן הפעילות...</div>'; return; }
  el.innerHTML = steps.slice(0, cur+1).map((s,i) => {
    const cls = s.logType==="arp"?"arp":s.logType==="arpr"?"arpr":s.logType==="data"?"data":s.logType==="flood"?"flood":"";
    const latest = i===cur?" latest":"";
    return `<div class="log-entry ${cls}${latest}">${s.logEntry}</div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}

// ──────────────────────────────────────────────
//  HOST LIST
// ──────────────────────────────────────────────
function renderHostList() {
  const wrap = document.getElementById("host-list");
  const sel  = document.getElementById("sel-src");
  if (!hosts.length) {
    wrap.innerHTML='<div class="empty">הוסף מחשבים למעלה</div>';
    sel.innerHTML=""; return;
  }
  wrap.innerHTML = hosts.map((h,i)=>
    `<span class="host-chip" onclick="removeHost(${i})">
      🖥️ <span class="hname">${h.name}</span>
      <span class="hip">${h.ip}</span>
      <span class="hmac">${h.mac}</span>
      <span class="del">✕</span>
    </span>`).join("");
  sel.innerHTML = hosts.map((h,i)=>
    `<option value="${i}">${h.name} (${h.ip})</option>`).join("");
}

// ──────────────────────────────────────────────
//  APPLY STEP
// ──────────────────────────────────────────────
function applyStep(step) {
  applyHighlight(step);
  renderNetwork(step);
  renderMacTable(step?.mac || {});
  renderArpTables(step?.arp || hosts.map(()=>({})));
  renderLog();
  const counter = document.getElementById("step-counter");
  const desc    = document.getElementById("step-desc");
  if (!steps.length) { counter.textContent="לחץ הרץ"; desc.textContent=""; }
  else { counter.textContent=`שלב ${Math.max(cur+1,0)} / ${steps.length}`; desc.textContent=step?.desc||""; }
}

// ──────────────────────────────────────────────
//  CONTROLS
// ──────────────────────────────────────────────
function nextStep() { if (steps.length && cur < steps.length-1) { cur++; applyStep(steps[cur]); } }
function prevStep() { if (cur < 0) return; cur--; applyStep(cur>=0?steps[cur]:null); }
function resetSim() { stopPlay(); cur=-1; applyStep(null); }

function togglePlay() {
  if (isPlaying) { stopPlay(); return; }
  if (!steps.length || cur >= steps.length-1) return;
  isPlaying = true;
  document.getElementById("play-btn").textContent = "⏸ עצור";
  scheduleNext();
}
function scheduleNext() {
  if (!isPlaying) return;
  if (cur >= steps.length-1) { stopPlay(); return; }
  const spd = parseInt(document.getElementById("speed").value, 10);
  playTimer = setTimeout(()=>{ nextStep(); scheduleNext(); }, spd);
}
function stopPlay() {
  isPlaying = false; clearTimeout(playTimer);
  document.getElementById("play-btn").textContent = "▶▶ אוטו";
}

function runSim() {
  stopPlay();
  const srcIdx = parseInt(document.getElementById("sel-src").value, 10);
  const dstIp  = document.getElementById("in-dst").value.trim();
  const msg    = document.getElementById("in-msg").value.trim() || "שלום!";
  if (!dstIp) { alert("הכנס IP יעד"); return; }
  steps = buildSim(srcIdx, dstIp, msg);
  if (!steps.length) { alert("לא נמצא יעד, או שמקור = יעד"); return; }
  cur = -1; applyStep(null);
}

function addHost() {
  const name = document.getElementById("in-name").value.trim();
  const ip   = document.getElementById("in-ip").value.trim();
  const mac  = document.getElementById("in-mac").value.trim() || `AA:${String(hosts.length+1).padStart(2,"0")}`;
  if (!name||!ip) { alert("שם ו-IP הם חובה"); return; }
  hosts.push({name,ip,mac});
  ["in-name","in-ip","in-mac"].forEach(id=>document.getElementById(id).value="");
  renderHostList(); resetSim(); renderNetwork(null);
}

function removeHost(idx) {
  if (!confirm(`למחוק את ${hosts[idx].name}?`)) return;
  hosts.splice(idx,1); renderHostList(); resetSim(); renderNetwork(null);
}

document.getElementById("speed").addEventListener("input", function(){
  document.getElementById("speed-label").textContent=(this.value/1000).toFixed(1)+"s";
});

// ──────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────
renderCode();
renderHostList();
renderNetwork(null);
renderMacTable({});
renderArpTables(hosts.map(()=>({})));
applyStep(null);
</script>
